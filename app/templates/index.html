<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veridane Policy Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f7f6;
      --surface: #ffffff;
      --ink: #15201c;
      --muted: #587268;
      --rule: #d3ddd9;
      --viridian: #0e5a45;
      --viridian-ink: #ffffff;
      --brass: #8c6a1c;
      --error: #9b2c2c;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0f1614;
        --surface: #16201d;
        --ink: #e4ece9;
        --muted: #93aba3;
        --rule: #2a3834;
        --viridian: #5fb39a;
        --viridian-ink: #0f1614;
        --brass: #d2ae5c;
        --error: #f19a9a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.55;
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    .bank { margin: 0; color: var(--viridian); font-weight: 600; }
    h1 {
      margin: 0.25rem 0 0.75rem;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .intro { margin: 0 0 0.5rem; max-width: 36rem; }
    .status { margin: 0 0 2.5rem; color: var(--muted); font-size: 0.9rem; }
    .status.offline { color: var(--error); }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
    textarea {
      width: 100%;
      min-height: 6rem;
      padding: 0.75rem;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 6px;
      resize: vertical;
    }
    .actions { display: flex; align-items: center; gap: 1rem; margin-top: 0.75rem; }
    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
    }
    .ask {
      padding: 0.6rem 1.4rem;
      background: var(--viridian);
      color: var(--viridian-ink);
      border: none;
    }
    .ask[disabled] { opacity: 0.6; cursor: progress; }
    .hint { color: var(--muted); font-size: 0.9rem; }
    textarea:focus-visible, button:focus-visible {
      outline: 3px solid var(--brass);
      outline-offset: 2px;
    }
    .examples { margin: 1.5rem 0 0; }
    .examples p { margin: 0 0 0.4rem; color: var(--muted); font-size: 0.9rem; }
    .example {
      display: block;
      width: 100%;
      margin-bottom: 0.4rem;
      padding: 0.5rem 0.75rem;
      text-align: left;
      font-weight: 400;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--rule);
    }
    .example:hover { border-color: var(--viridian); }
    .answer {
      margin-top: 2.5rem;
      padding: 0.25rem 0 0.25rem 1.25rem;
      border-left: 4px solid var(--viridian);
    }
    .answer[hidden] { display: none; }
    .answer.error { border-left-color: var(--error); }
    .answer-text { margin: 0; white-space: pre-wrap; }
    .sources { margin-top: 1.25rem; }
    .sources h2 { font-size: 1rem; margin: 0 0 0.5rem; }
    .source { margin: 0 0 0.9rem; }
    .source-id {
      color: var(--brass);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-decoration: none;
    }
    .source-id:hover { text-decoration: underline; }
    .snippet { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <p class="bank">Veridane Bank</p>
    <h1>Policy Assistant</h1>
    <p class="intro">Ask about leave, security, KYC, expenses, remote work, or any other
      Veridane policy. Every answer names the policy it comes from.</p>
    <p class="status" id="status" role="status">Checking the service...</p>

    <form id="ask-form">
      <label for="question">Your question</label>
      <textarea id="question" name="question" maxlength="1000"
        placeholder="For example: how long is mandatory block leave?" required></textarea>
      <div class="actions">
        <button class="ask" type="submit" id="ask-button">Ask</button>
        <span class="hint">Answers cover Veridane policies only.</span>
      </div>
    </form>

    <div class="examples">
      <p>Try one of these</p>
      <button class="example" type="button">How many days of annual leave does a Band D officer get?</button>
      <button class="example" type="button">What happens to a teller's CoreLink access during mandatory block leave?</button>
      <button class="example" type="button">Who do I call to report a lost corporate card?</button>
    </div>

    <section class="answer" id="answer" aria-live="polite" hidden>
      <p class="answer-text" id="answer-text"></p>
      <div class="sources" id="sources" hidden>
        <h2>Sources</h2>
        <div id="source-list"></div>
      </div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const form = document.getElementById("ask-form");
    const questionEl = document.getElementById("question");
    const askButton = document.getElementById("ask-button");
    const answerEl = document.getElementById("answer");
    const answerText = document.getElementById("answer-text");
    const sourcesEl = document.getElementById("sources");
    const sourceList = document.getElementById("source-list");

    async function checkHealth() {
      try {
        const response = await fetch("/health");
        const body = await response.json();
        statusEl.textContent = `Connected. ${body.corpus_documents} policy documents available.`;
        statusEl.classList.remove("offline");
      } catch {
        statusEl.textContent = "Can't reach the service. Check that the app is running.";
        statusEl.classList.add("offline");
      }
    }

    function showAnswer(text, citations, isError) {
      answerEl.hidden = false;
      answerEl.classList.toggle("error", isError);
      answerText.textContent = text;
      sourceList.replaceChildren();
      sourcesEl.hidden = !citations || citations.length === 0;
      (citations || []).forEach((citation) => {
        const item = document.createElement("div");
        item.className = "source";
        const link = document.createElement("a");
        link.className = "source-id";
        link.href = citation.url || "#";
        link.textContent = `${citation.doc_id} ${citation.title || ""} ${citation.section || ""}`.trim();
        item.appendChild(link);
        if (citation.snippet) {
          const snippet = document.createElement("p");
          snippet.className = "snippet";
          snippet.textContent = citation.snippet;
          item.appendChild(snippet);
        }
        sourceList.appendChild(item);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionEl.value.trim();
      if (!question) return;
      askButton.disabled = true;
      askButton.textContent = "Asking...";
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const body = await response.json();
        if (response.ok) {
          showAnswer(body.answer, body.citations, false);
        } else {
          showAnswer(body.error || "The request failed.", [], true);
        }
      } catch {
        showAnswer("The request didn't reach the service. Check your connection and try again.", [], true);
      } finally {
        askButton.disabled = false;
        askButton.textContent = "Ask";
      }
    });

    document.querySelectorAll(".example").forEach((button) => {
      button.addEventListener("click", () => {
        questionEl.value = button.textContent;
        questionEl.focus();
      });
    });

    checkHealth();
  </script>
</body>
</html>
